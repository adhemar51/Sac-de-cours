<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faire son sac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF7EE;
    --ink: #2B3A55;
    --ink-soft: #5B6A85;
    --line: #D8CFBB;
    --margin-red: #D9736B;
    --accent-fallback: #B9C9D9;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  html, body { background: var(--paper); }
  body {
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 18px 60px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 31px,
      var(--line) 32px
    );
    background-attachment: local;
  }
  h1 {
    font-family: 'Kalam', cursive;
    font-size: 1.7rem;
    color: var(--ink);
    margin: 4px 0 2px;
    padding-left: 26px;
    position: relative;
  }
  h1::before {
    content: "";
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 4px;
    width: 4px;
    background: var(--margin-red);
    border-radius: 2px;
  }
  #progress {
    font-size: 0.92rem;
    color: var(--ink-soft);
    margin: 2px 0 18px 26px;
  }

  #day-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 22px;
    padding-left: 26px;
    overflow-x: auto;
  }
  #day-tabs button {
    font-family: 'Kalam', cursive;
    font-size: 1rem;
    padding: 8px 14px 7px;
    border: 2px solid var(--ink);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    background: #EFE8D8;
    color: var(--ink-soft);
    cursor: pointer;
    position: relative;
    top: 2px;
    white-space: nowrap;
  }
  #day-tabs button.active {
    background: var(--paper);
    color: var(--ink);
    top: 0;
    box-shadow: 0 -2px 0 var(--paper);
  }

  #categories { padding-left: 26px; }

  .cat-block {
    background: #FFFDF8;
    border: 2px solid var(--ink);
    border-left-width: 8px;
    border-radius: 4px 10px 10px 4px;
    padding: 12px 14px 10px;
    margin-bottom: 16px;
  }
  .cat-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .cat-title input {
    font-family: 'Kalam', cursive;
    font-size: 1.15rem;
    font-weight: 700;
    border: none;
    background: transparent;
    color: var(--ink);
    width: 65%;
    padding: 2px 0;
  }
  .cat-title input:focus { outline: 1px dashed var(--line); }

  button.del {
    font-family: 'Nunito', sans-serif;
    font-size: 0.78rem;
    color: var(--margin-red);
    background: none;
    border: 1px solid var(--margin-red);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.del:hover { background: var(--margin-red); color: white; }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 2px;
    border-bottom: 1px dotted var(--line);
  }
  li:last-child { border-bottom: none; }
  li input[type=checkbox] {
    width: 19px;
    height: 19px;
    accent-color: var(--ink);
    flex-shrink: 0;
  }
  li.checked span { text-decoration: line-through; color: var(--ink-soft); opacity: 0.7; }
  li span { flex: 1; font-size: 0.98rem; }
  li button.del { font-size: 0.75rem; padding: 2px 7px; }

  form.add-item { display: flex; gap: 6px; margin-top: 10px; }
  form.add-item input[type=text] {
    flex: 1;
    font-family: 'Nunito', sans-serif;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    background: var(--paper);
    color: var(--ink);
  }
  form.add-item button {
    font-family: 'Kalam', cursive;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: #EFE8D8;
    color: var(--ink);
    padding: 4px 14px;
    cursor: pointer;
  }

  .add-cat {
    padding-left: 26px;
    margin: 18px 0 10px;
    display: flex;
    gap: 6px;
  }
  .add-cat input {
    flex: 1;
    font-family: 'Nunito', sans-serif;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    background: #FFFDF8;
    color: var(--ink);
  }
  .add-cat button {
    font-family: 'Kalam', cursive;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: #EFE8D8;
    color: var(--ink);
    padding: 6px 14px;
    cursor: pointer;
  }

  #reset-btn {
    margin: 24px 0 0 26px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    background: none;
    border: 1px solid var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }

  .hint {
    padding-left: 26px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: -10px 0 18px;
  }

  @media (max-width: 420px) {
    h1 { font-size: 1.4rem; }
    #progress, #categories, .add-cat, #reset-btn, .hint { padding-left: 16px; }
    #day-tabs { padding-left: 16px; }
  }
</style>
</head>
<body>
<h1>Mon sac de cours</h1>
<div id="progress">Chargement...</div>
<div id="day-tabs"></div>
<p class="hint">Ajouter/supprimer une affaire s'applique à tous les jours de cette matière — mais cocher ne compte que pour le jour affiché.</p>
<div id="categories"></div>

<form class="add-cat" id="add-cat-form">
  <input type="text" id="new-cat-name" placeholder="Nouvelle matière (ce jour)" required>
  <button type="submit">Ajouter</button>
</form>

<button id="reset-btn">Tout réinitialiser</button>

<script>
(function () {
  var STORAGE_KEY = 'packing-list-shared-v2';

  var palette = ["#FFB4A2", "#A8C8FF", "#6E8894", "#FF6FB5", "#FFD166", "#8FE3C4",
                 "#FF8C42", "#4C6EF5", "#F7A8B8", "#4FA8DE", "#B9A0DB", "#C9C9C9"];

  function colorFor(name, index) {
    return palette[index % palette.length];
  }

  var idCounter = 0;
  function makeId() {
    idCounter++;
    return 'i' + Date.now() + '_' + idCounter;
  }

  function item(name) {
    return { id: makeId(), name: name };
  }

  function defaultSubjects() {
    var names = ["Vie de classe", "Mathématiques", "Espagnol", "Technologie", "Français",
      "Anglais", "Sciences (SVT)", "Arts plastiques", "Histoire-Géographie", "EPS",
      "Théâtre", "Physique-Chimie", "Musique", "RHC"];
    var subjects = {};
    names.forEach(function (name, i) {
      var items = [];
      if (name === "EPS") {
        items = [item("Tenue de sport"), item("Baskets")];
      } else if (["Vie de classe", "Théâtre", "Musique", "RHC"].indexOf(name) === -1) {
        items = [item("Cahier"), item("Manuel"), item("Classeur / pochette")];
      }
      subjects[name] = { color: colorFor(name, i), items: items };
    });
    return subjects;
  }

  function defaultDays() {
    return {
      "Lundi": ["Vie de classe", "Mathématiques", "Espagnol", "Technologie", "Français", "Anglais", "Sciences (SVT)"],
      "Mardi": ["Français", "Arts plastiques", "Espagnol", "Histoire-Géographie", "Mathématiques", "Anglais"],
      "Mercredi": ["Histoire-Géographie", "Français", "EPS"],
      "Jeudi": ["Théâtre", "Espagnol", "Physique-Chimie", "Mathématiques", "Anglais", "Musique", "Français"],
      "Vendredi": ["EPS", "Mathématiques", "RHC", "Histoire-Géographie", "Sciences (SVT)", "Technologie", "Anglais", "Physique-Chimie"]
    };
  }

  var dayOrder = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];

  function defaultData() {
    return { subjects: defaultSubjects(), days: defaultDays(), checked: {} };
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.subjects && parsed.days) {
          if (!parsed.checked) parsed.checked = {};
          return parsed;
        }
      }
    } catch (e) {
      console.error('Erreur de lecture du stockage', e);
    }
    return defaultData();
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.error('Erreur de sauvegarde', e);
    }
  }

  var data = loadData();
  var currentDay = dayOrder[0];

  var tabsEl = document.getElementById('day-tabs');
  var categoriesEl = document.getElementById('categories');
  var progressEl = document.getElementById('progress');

  function isChecked(day, subjectName, itemId) {
    return !!(data.checked[day] && data.checked[day][subjectName] && data.checked[day][subjectName][itemId]);
  }

  function setChecked(day, subjectName, itemId, value) {
    if (!data.checked[day]) data.checked[day] = {};
    if (!data.checked[day][subjectName]) data.checked[day][subjectName] = {};
    data.checked[day][subjectName][itemId] = value;
  }

  function removeItemChecked(subjectName, itemId) {
    dayOrder.forEach(function (day) {
      if (data.checked[day] && data.checked[day][subjectName]) {
        delete data.checked[day][subjectName][itemId];
      }
    });
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    dayOrder.forEach(function (day) {
      var btn = document.createElement('button');
      btn.textContent = day;
      if (day === currentDay) btn.className = 'active';
      btn.addEventListener('click', function () {
        currentDay = day;
        render();
      });
      tabsEl.appendChild(btn);
    });
  }

  function render() {
    renderTabs();
    categoriesEl.innerHTML = '';
    var total = 0, done = 0;
    var subjectNames = data.days[currentDay] || [];

    subjectNames.forEach(function (subjectName, dayIndex) {
      var subject = data.subjects[subjectName];
      if (!subject) return;

      var block = document.createElement('div');
      block.className = 'cat-block';
      block.style.borderLeftColor = subject.color || '#B9C9D9';

      var titleDiv = document.createElement('div');
      titleDiv.className = 'cat-title';

      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = subjectName;
      nameInput.addEventListener('change', function () {
        var newName = nameInput.value.trim();
        if (!newName || newName === subjectName) { nameInput.value = subjectName; return; }
        renameSubject(subjectName, newName);
        saveData();
        render();
      });

      var delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = 'Retirer de ce jour';
      delBtn.addEventListener('click', function () {
        data.days[currentDay].splice(dayIndex, 1);
        saveData();
        render();
      });

      titleDiv.appendChild(nameInput);
      titleDiv.appendChild(delBtn);
      block.appendChild(titleDiv);

      var ul = document.createElement('ul');
      subject.items.forEach(function (it, itemIndex) {
        total++;
        var checked = isChecked(currentDay, subjectName, it.id);
        if (checked) done++;

        var li = document.createElement('li');
        if (checked) li.className = 'checked';

        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = checked;
        checkbox.addEventListener('change', function () {
          setChecked(currentDay, subjectName, it.id, checkbox.checked);
          saveData();
          render();
        });

        var span = document.createElement('span');
        span.textContent = it.name;

        var itemDelBtn = document.createElement('button');
        itemDelBtn.className = 'del';
        itemDelBtn.textContent = '✕';
        itemDelBtn.title = 'Retirer cette affaire de toutes les ' + subjectName;
        itemDelBtn.addEventListener('click', function () {
          subject.items.splice(itemIndex, 1);
          removeItemChecked(subjectName, it.id);
          saveData();
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(itemDelBtn);
        ul.appendChild(li);
      });
      block.appendChild(ul);

      var addForm = document.createElement('form');
      addForm.className = 'add-item';
      var addInput = document.createElement('input');
      addInput.type = 'text';
      addInput.placeholder = 'Ajouter une affaire';
      addInput.required = true;
      var addBtn = document.createElement('button');
      addBtn.type = 'submit';
      addBtn.textContent = '+';

      addForm.appendChild(addInput);
      addForm.appendChild(addBtn);
      addForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = addInput.value.trim();
        if (!name) return;
        subject.items.push(item(name));
        saveData();
        render();
      });

      block.appendChild(addForm);
      categoriesEl.appendChild(block);
    });

    progressEl.textContent = total === 0
      ? 'Aucune affaire pour ' + currentDay + '.'
      : done + ' / ' + total + ' affaires préparées pour ' + currentDay;
  }

  function renameSubject(oldName, newName) {
    if (data.subjects[newName]) {
      var existingItems = data.subjects[newName].items;
      var existingNames = existingItems.map(function (i) { return i.name; });
      data.subjects[oldName].items.forEach(function (it) {
        if (existingNames.indexOf(it.name) === -1) existingItems.push(it);
      });
    } else {
      data.subjects[newName] = data.subjects[oldName];
    }
    delete data.subjects[oldName];
    dayOrder.forEach(function (day) {
      data.days[day] = data.days[day].map(function (n) { return n === oldName ? newName : n; });
      if (data.checked[day] && data.checked[day][oldName]) {
        data.checked[day][newName] = Object.assign(data.checked[day][newName] || {}, data.checked[day][oldName]);
        delete data.checked[day][oldName];
      }
    });
  }

  document.getElementById('add-cat-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('new-cat-name');
    var name = input.value.trim();
    if (!name) return;

    if (!data.subjects[name]) {
      var subjectCount = Object.keys(data.subjects).length;
      data.subjects[name] = { color: colorFor(name, subjectCount), items: [] };
    }
    if (data.days[currentDay].indexOf(name) === -1) {
      data.days[currentDay].push(name);
    }
    input.value = '';
    saveData();
    render();
  });

  document.getElementById('reset-btn').addEventListener('click', function () {
    if (confirm('Effacer toute la liste et revenir aux réglages de départ ?')) {
      data = defaultData();
      saveData();
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
